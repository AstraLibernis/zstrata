<style>
/* Layout: one reading column; the tier ladder runs as a vertical spine, each tier a section that
   pairs a plain-language finding with its measured chart. */
:root {
  --bg: #f7f8f7;
  --surface: #fcfcfb;
  --ink: #0f1412;
  --ink-2: #4c5450;
  --muted: #7d8681;
  --grid: #e2e5e1;
  --axis: #c1c7c2;
  --line: rgba(15,20,18,0.10);
  --accent: #1f6fc5;
  --hot: #c2410c;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --on-strong: #ffffff;
  --seq0: #eef4fc; --seq1: #cde2fb; --seq2: #9ec5f4; --seq3: #5598e7; --seq4: #256abf; --seq5: #104281;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1211; --surface: #171a19; --ink: #eef0ee; --ink-2: #bcc3bf; --muted: #868f8a;
    --grid: #262a28; --axis: #3a3f3c; --line: rgba(255,255,255,0.10); --accent: #5598e7; --hot: #f08a5d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
    --on-strong: #0f1211;
    --on-strong: #0f1211;
  --seq0: #172235; --seq1: #183a66; --seq2: #1c5cab; --seq3: #3987e5; --seq4: #86b6ef; --seq5: #cde2fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1211; --surface: #171a19; --ink: #eef0ee; --ink-2: #bcc3bf; --muted: #868f8a;
  --grid: #262a28; --axis: #3a3f3c; --line: rgba(255,255,255,0.10); --accent: #5598e7; --hot: #f08a5d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
  --on-strong: #0f1211;
  --seq0: #172235; --seq1: #183a66; --seq2: #1c5cab; --seq3: #3987e5; --seq4: #86b6ef; --seq5: #cde2fb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 700; line-height: 1.05; }
h2 { font-size: 1.6rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; max-width: 66ch; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.08rem; color: var(--ink-2); }
header { display: grid; gap: 14px; margin-bottom: 36px; }
.meta { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* Tier ladder: the card drawn as nested levels, each with its measured headline. */
.ladder { display: grid; gap: 6px; margin: 8px 0 48px; }
.tier { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.tier a { color: inherit; text-decoration: none; }
.tier .name { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; }
.tier .what { color: var(--ink-2); font-size: 0.9rem; min-width: 0; }
.tier .num { font-family: var(--f-mono); font-size: 0.95rem; text-align: right; white-space: nowrap; }
.tier .num b { font-weight: 500; color: var(--ink); }
.tier .num span { color: var(--muted); font-size: 0.78rem; }
.tier .depth { display: block; height: 3px; border-radius: 2px; background: var(--accent); opacity: 0.85; margin-top: 6px; }
@media (max-width: 640px) {
  .tier { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .tier .num { text-align: left; white-space: normal; }
}

section.tier-sec { display: grid; gap: 14px; padding-top: 34px; margin-top: 34px; border-top: 1px solid var(--line); }
.find { display: grid; gap: 8px; }
.find ul { margin: 4px 0 0; padding-left: 1.1rem; max-width: 66ch; color: var(--ink-2); }
.find li { margin: 3px 0; }
.find li b { color: var(--ink); font-weight: 600; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 12px 8px; position: relative; min-width: 0; }
.chart .ttl { font-family: var(--f-display); font-weight: 600; font-size: 0.95rem; margin: 0 4px 2px; }
.chart .sub { font-size: 0.8rem; color: var(--muted); margin: 0 4px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 4px 6px; font-size: 0.8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
.legend i.box { width: 10px; height: 10px; border-radius: 2px; }
.legend i.dash { background: none !important; border-top: 2px dashed currentColor; height: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
svg .lbl { fill: var(--ink-2); font-size: 11px; }
svg .note { fill: var(--ink); font-size: 11px; font-family: var(--f-body); }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  box-shadow: 0 4px 14px rgba(0,0,0,0.12); border-radius: 5px; padding: 7px 9px; font-size: 0.78rem; min-width: 9rem; z-index: 5; }
.tip .h { color: var(--muted); font-family: var(--f-mono); font-size: 0.72rem; margin-bottom: 3px; }
.tip .r { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); }
.tip .r i { width: 10px; height: 2px; flex: none; }
.tip .r b { font-weight: 500; }
.tip .r span { color: var(--muted); }

.rules { display: grid; gap: 10px; counter-reset: rule; margin-top: 6px; }
.rule { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: baseline; }
.rule::before { counter-increment: rule; content: counter(rule); font-family: var(--f-mono); color: var(--accent); font-size: 0.9rem; }
.rule p b { font-weight: 600; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-size: 0.88rem; }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 8px; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; font-family: var(--f-mono); font-size: 0.74rem; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 4px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 500; }
td:first-child, td:nth-child(2), th:first-child, th:nth-child(2) { text-align: left; }
.foot { margin-top: 48px; color: var(--muted); font-size: 0.82rem; display: grid; gap: 6px; }
code { font-family: var(--f-mono); font-size: 0.86em; }
</style>
